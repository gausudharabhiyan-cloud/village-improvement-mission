<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIM 3D Admin</title><link rel="stylesheet" href="admin.css"></head><body><div class="scene"><div class="sun"></div><div class="hill h1"></div><div class="hill h2"></div><div class="tree t1"></div><div class="tree t2"></div><div class="house"></div><div class="road"></div></div><header><a href="../" class="brand">🌱 <span>गांव सुधार मिशन<small>Admin Control Center</small></span></a><button id="logout">Logout</button></header><main><section id="login" class="login-card glass"><div class="logo3d">🏡</div><span class="eyebrow">SECURE ACCESS</span><h1>Admin Panel</h1><p>गांव सुधार मिशन के लिए अधिकृत प्रशासनिक पैनल</p><label>Admin ID<input id="adminId" autocomplete="username" placeholder="Enter Admin ID"></label><label>Password<div class="pass"><input id="password" type="password" autocomplete="current-password" placeholder="Enter Password"><button id="eye" type="button">👁</button></div></label><button id="loginBtn" class="login-btn">LOGIN <span>→</span></button><div id="loginMsg"></div></section><section id="dashboard" hidden><div class="dash-title"><div><span class="eyebrow">CONTROL CENTER</span><h2>Welcome, Admin 👋</h2></div><button id="refresh">↻ Refresh Data</button></div><div class="stats"><div class="stat glass"><span>📋</span><b id="total">0</b><small>Total Complaints</small></div><div class="stat glass"><span>📥</span><b id="received">0</b><small>Received</small></div><div class="stat glass"><span>⚙️</span><b id="progress">0</b><small>In Process</small></div><div class="stat glass"><span>✅</span><b id="resolved">0</b><small>Resolved</small></div></div><div class="panel glass"><div class="toolbar"><input id="search" placeholder="🔎 ID, नाम, गांव, जिला..."><select id="filter"><option value="">All Status</option><option>Received</option><option>Verified</option><option>Forwarded</option><option>Under Process</option><option>Resolved</option></select></div><div class="table-wrap"><table><thead><tr><th>Complaint ID</th><th>नाम</th><th>जिला</th><th>गांव</th><th>Category</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div><div id="editor" class="panel glass" hidden><span class="eyebrow">CASE MANAGEMENT</span><h3>Complaint Update</h3><input type="hidden" id="editId"><div class="edit-grid"><label>Status<select id="editStatus"><option>Received</option><option>Verified</option><option>Forwarded</option><option>Under Process</option><option>Resolved</option></select></label><label>Verification<select id="editVerification"><option>Pending</option><option>Verified</option><option>Rejected</option></select></label><label>Department<input id="editDept"></label><label>Reference No.<input id="editRef"></label><label>Follow-up<input id="editFollow"></label><label>Action Taken<textarea id="editAction"></textarea></label><label>Remarks<textarea id="editRemarks"></textarea></label></div><button id="save">Save Update ✓</button> <button id="cancel" class="secondary">Cancel</button><span id="editMsg"></span></div></section></main><script src="admin-config.js"></script><script src="admin.js"></script></body></html>
